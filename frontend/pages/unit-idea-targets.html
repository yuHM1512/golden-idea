<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Mục tiêu ý tưởng vàng</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }

    </style>
  </head>
  <body class="bg-[#f8f9fa] font-['Inter'] text-[#191c1d] min-h-screen">
    <header class="bg-white/80 backdrop-blur-xl sticky top-0 z-40 shadow-[0px_20px_40px_rgba(25,28,29,0.05)]">
      <div class="max-w-6xl mx-auto px-4 md:px-8 py-2 flex items-center justify-between">
        <a href="/pages/menu" class="flex items-center gap-3 text-slate-700 hover:text-slate-900">
          <span class="material-symbols-outlined">arrow_back</span>
          <span class="font-semibold">Menu</span>
        </a>
        <a href="/menu" class="block">
          <div class="w-48 h-10 md:w-56 md:h-12 bg-transparent flex items-center justify-center overflow-hidden">
            <img src="../static/Marex.png" alt="Marex" class="block w-full h-full object-contain" />
          </div>
        </a>
        <button class="px-4 py-2 rounded-xl text-slate-700 hover:bg-slate-100 font-semibold" onclick="logout()">
          Đăng xuất
        </button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 md:px-8 py-10 space-y-6">
      <a href="/pages/settings" class="inline-flex items-center gap-2 font-semibold text-[#002b73]" id="backToSettings"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>Quay lại Cài đặt</a>
      <div id="ideaTargetContent"></div>
    </main>
    <script src="../js/api.js?v=20260909-unit-idea-targets"></script>
    <script>
      let currentUser = null;
      function logout() {
        localStorage.removeItem("is_logged_in");
        localStorage.removeItem("employee_code");
        window.location.href = "/pages/login";
      }
      function getCurrentTimeZoneYear() {
        return Number(new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Bangkok", year: "numeric"}).format(new Date()));
      }
      let unitIdeaTargets = [];
      let targetLoadVersion = 0;

      function showSelectedUnitTarget() {
        const unitId = Number(document.getElementById("ideaTargetUnit").value);
        const row = unitIdeaTargets.find(item => item.unit_id === unitId);
        document.getElementById("ideaTargetCount").value = row?.target_count ?? "";
      }

      async function loadUnitIdeaTargets() {
        const version = ++targetLoadVersion;
        const year = Number(document.getElementById("ideaTargetYear").value);
        const button = document.getElementById("ideaTargetSave");
        button.disabled = true;
        unitIdeaTargets = [];
        showSelectedUnitTarget();
        if (!Number.isInteger(year) || year < 2000 || year > 2100) return;
        try {
          const result = await api.getUnitIdeaTargets(currentUser.employee_code, year);
          if (version !== targetLoadVersion) return;
          unitIdeaTargets = result.items;
          showSelectedUnitTarget();
          button.disabled = false;
        } catch (error) {
          if (version === targetLoadVersion) showNotification(error.message, "error");
        }
      }

      async function saveUnitIdeaTarget(event) {
        event.preventDefault();
        const year = Number(document.getElementById("ideaTargetYear").value);
        const unitId = Number(document.getElementById("ideaTargetUnit").value);
        const input = document.getElementById("ideaTargetCount");
        const count = Number(input.value);
        if (!input.value.trim() || !Number.isInteger(count) || count < 0 || count > 2147483647) return;
        const button = document.getElementById("ideaTargetSave");
        button.disabled = true;
        try {
          await api.updateUnitIdeaTarget(currentUser.employee_code, year, unitId, count);
          showNotification("Đã lưu mục tiêu ý tưởng vàng", "success");
          await loadUnitIdeaTargets();
        } catch (error) {
          showNotification(error.message, "error");
          button.disabled = false;
        }
      }

      async function initUnitIdeaTargets() {
        const card = document.createElement("section");
        card.className = "md:col-span-2 rounded-3xl bg-white p-6 shadow-sm";
        card.innerHTML = `
          <h1 class="text-2xl font-bold text-[#002b73]">Mục tiêu ý tưởng vàng theo đơn vị</h1>
          <p class="mt-2 text-sm text-slate-600">Thiết lập số lượng mục tiêu cho từng đơn vị, từng năm. Mục tiêu cả năm được hiển thị trên biểu đồ Ý tưởng theo đơn vị trong Kho ý tưởng.</p>
          <form onsubmit="saveUnitIdeaTarget(event)" class="mt-5 grid gap-4 md:grid-cols-4 items-end">
            <label class="text-sm font-semibold">Năm<input id="ideaTargetYear" type="number" min="2000" max="2100" required class="mt-2 w-full rounded-xl border-slate-200" onchange="loadUnitIdeaTargets()" /></label>
            <label class="text-sm font-semibold">Đơn vị<select id="ideaTargetUnit" required class="mt-2 w-full rounded-xl border-slate-200" onchange="showSelectedUnitTarget()"></select></label>
            <label class="text-sm font-semibold">Số lượng mục tiêu<input id="ideaTargetCount" type="number" min="0" max="2147483647" step="1" required placeholder="Chưa thiết lập" class="mt-2 w-full rounded-xl border-slate-200" /></label>
            <button id="ideaTargetSave" type="submit" disabled class="rounded-xl bg-[#002b73] px-4 py-3 text-white font-semibold disabled:opacity-50">Lưu mục tiêu</button>
          </form>`;
        document.getElementById("ideaTargetContent").appendChild(card);
        document.getElementById("ideaTargetYear").value = getCurrentTimeZoneYear();
        const units = await api.getUnits();
        const select = document.getElementById("ideaTargetUnit");
        units.forEach(unit => select.add(new Option(unit.department ? `${unit.department} • ${unit.name}` : unit.name, unit.id)));
        await loadUnitIdeaTargets();
      }

      async function init() {
        if (localStorage.getItem("is_logged_in") !== "true") {
          window.location.href = "/pages/login";
          return;
        }
        const code = (localStorage.getItem("employee_code") || "").trim();
        currentUser = await api.getUserByCode(code);
        if (!currentUser || !["admin", "ie_manager"].includes(currentUser.role)) {
          window.location.href = "/pages/menu";
          return;
        }
        await initUnitIdeaTargets();
      }
      init().catch(error => showNotification(error.message, "error"));
    </script>
  </body>
</html>
