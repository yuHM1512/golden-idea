<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Mục tiêu ý tưởng vàng</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }

    </style>
  </head>
  <body class="bg-[#f8f9fa] font-['Inter'] text-[#191c1d] min-h-screen">
    <header class="bg-white/80 backdrop-blur-xl sticky top-0 z-40 shadow-[0px_20px_40px_rgba(25,28,29,0.05)]">
      <div class="max-w-6xl mx-auto px-4 md:px-8 py-2 flex items-center justify-between">
        <a href="/pages/menu" class="flex items-center gap-3 text-slate-700 hover:text-slate-900">
          <span class="material-symbols-outlined">arrow_back</span>
          <span class="font-semibold">Menu</span>
        </a>
        <a href="/menu" class="block">
          <div class="w-48 h-10 md:w-56 md:h-12 bg-transparent flex items-center justify-center overflow-hidden">
            <img src="../static/Marex.png" alt="Marex" class="block w-full h-full object-contain" />
          </div>
        </a>
        <button class="px-4 py-2 rounded-xl text-slate-700 hover:bg-slate-100 font-semibold" onclick="logout()">
          Đăng xuất
        </button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 md:px-8 py-10 space-y-6">
      <a href="/pages/settings" class="inline-flex items-center gap-2 font-semibold text-[#002b73]" id="backToSettings"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>Quay lại Cài đặt</a>
      <section class="rounded-3xl bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-bold text-[#002b73]">Mục tiêu ý tưởng vàng theo nhóm đơn vị</h1>
        <p class="mt-2 text-sm text-slate-600">Mỗi nhóm có một mục tiêu cả năm. Dashboard cộng số ý tưởng của các đơn vị thành viên và hiển thị chung một cột.</p>
        <label class="block mt-5 max-w-xs text-sm font-semibold">Năm<input id="ideaTargetYear" type="number" min="2000" max="2100" required class="mt-2 w-full rounded-xl border-slate-200" onchange="loadUnitIdeaTargets()" /></label>
        <p id="targetTotals" class="mt-5 font-semibold text-[#002b73]" aria-live="polite"></p>
        <p id="targetExclusions" class="mt-2 text-sm text-slate-500"></p>
        <div class="overflow-x-auto mt-4"><table class="w-full text-sm text-left"><thead class="bg-slate-50"><tr><th class="p-4">Nhóm</th><th class="p-4">Đơn vị thành viên</th><th class="p-4">LĐTT</th><th class="p-4">Mục tiêu</th><th class="p-4">Tỷ lệ</th><th class="p-4">Thao tác</th></tr></thead><tbody id="targetGroupRows"></tbody></table></div>
      </section>
      <section class="rounded-3xl bg-white p-6 shadow-sm">
        <h2 id="targetFormTitle" class="text-xl font-bold text-[#002b73]">Thêm mục tiêu</h2>
        <form onsubmit="saveUnitIdeaTarget(event)">
          <fieldset id="targetFields" disabled class="mt-5 grid gap-4 md:grid-cols-2 disabled:opacity-60">
            <label class="text-sm font-semibold">Tên nhóm hiển thị<input id="ideaTargetName" maxlength="255" required class="mt-2 w-full rounded-xl border-slate-200" placeholder="Ví dụ: YTE+Lab" /></label>
            <label class="text-sm font-semibold md:row-span-3">Đơn vị thành viên<select id="ideaTargetUnit" multiple size="8" required class="mt-2 w-full rounded-xl border-slate-200" aria-describedby="targetUnitHelp"></select><span id="targetUnitHelp" class="block mt-2 text-xs text-slate-500">Giữ Ctrl (hoặc Command) để chọn nhiều đơn vị. Một đơn vị chỉ thuộc một nhóm trong cùng năm.</span></label>
            <label class="text-sm font-semibold">Số lượng mục tiêu<input id="ideaTargetCount" type="number" min="0" max="2147483647" step="1" required class="mt-2 w-full rounded-xl border-slate-200" /></label>
            <div class="grid grid-cols-2 gap-4"><label class="text-sm font-semibold">LĐTT<input id="ideaTargetHeadcount" type="number" min="0" max="2147483647" step="1" class="mt-2 w-full rounded-xl border-slate-200" /></label><label class="text-sm font-semibold">Tỷ lệ (%)<input id="ideaTargetPercent" type="number" min="0" max="100" step="0.01" class="mt-2 w-full rounded-xl border-slate-200" /></label></div>
            <div class="flex gap-3"><button id="ideaTargetSave" class="rounded-xl bg-[#002b73] px-5 py-3 text-white font-semibold" type="submit">Lưu mục tiêu</button><button class="rounded-xl bg-slate-100 px-5 py-3 font-semibold" type="button" onclick="resetTargetForm()">Thêm mới</button></div>
          </fieldset>
        </form>
      </section>
    </main>
    <script src="../js/api.js?v=20260910-groups"></script>
    <script src="../js/unit-idea-targets.js?v=20260910-groups"></script>
  </body>
</html>
